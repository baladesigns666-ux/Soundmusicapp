name: Build Sound Music APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Copy Source + LOGO.png
        run: |
          flutter create --org com.kitesoftwares --project-name sound_music app_build
          cp -r sound_music_retro/lib/* app_build/lib/
          cp sound_music_retro/pubspec.yaml app_build/pubspec.yaml
          cp sound_music_retro/android/app/src/main/AndroidManifest.xml app_build/android/app/src/main/AndroidManifest.xml
          mkdir -p app_build/assets
          cp sound_music_retro/assets/LOGO.png app_build/assets/LOGO.png

      - name: Configure Android SDK & Fix Plugin Namespace
        run: |
          cd app_build/android
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' app/build.gradle.kts || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/g' app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' app/build.gradle.kts || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' app/build.gradle || true

          cat << 'EOF' >> build.gradle.kts

          subprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.library")) {
                      extensions.configure<com.android.build.gradle.LibraryExtension>("android") {
                          if (namespace == null) {
                              namespace = group.toString()
                          }
                          compileSdk = 35
                      }
                  }
              }
          }
          EOF

      - name: Generate App Launcher Icon & Build Release APK
        run: |
          cd app_build
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sound-Music-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
