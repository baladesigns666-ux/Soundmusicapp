version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  just_audio: ^0.9.40
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
